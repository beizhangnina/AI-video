[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aivideo"
version = "0.1.0"
description = "Script-driven AI video generation workflow on top of Token360"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "moviepy>=2.0",
    "Pillow>=10.0",
    "pydub>=0.25",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aivideo = "aivideo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aivideo"]

[tool.ruff]
line-length = 100
target-version = "py311"
